services:
  postgres:
    image: postgres:16-alpine
    container_name: bunny-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: bunny
      POSTGRES_PASSWORD: bunny
      POSTGRES_DB: bunny
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bunny -d bunny']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bunny-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunny-backend
    ports:
      - '5000:5000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - BASE_URL=http://localhost:5000
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgres://bunny:bunny@postgres:5432/bunny
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - DISABLE_BACKGROUND_JOBS=true
      - DISABLE_BOTS=true
      - DISABLE_MINES_BOTS=true
      - DISABLE_SCHEDULED_JOBS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:5000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: yarn dev

volumes:
  postgres_data:
  redis_data:
