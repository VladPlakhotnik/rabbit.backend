# fly.toml app configuration file generated for rabbit-backend on 2026-05-01T01:01:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rabbit-backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  # `auto_stop_machines = 'off'` + `min_machines_running = 1` keeps one
  # machine alive 24/7 — no cold-start latency on first request after
  # idle. Costs ~$2/mo on shared-cpu-1x/256MB regardless of traffic.
  # The default 'stop' would scale-to-zero, which is cheaper but
  # introduces 5-15 sec cold starts that we explicitly want to avoid.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1

# Free virtual memory via disk paging. Doesn't replace real RAM (much
# slower, especially under sustained pressure), but absorbs short
# bursts — GC pauses, one-off heavy queries, the cold-start spike —
# without the kernel killing node. If we keep OOM-ing on real traffic
# rather than bursts, the right answer is `fly scale memory 512`
# ($5/mo) instead of leaning on swap.
swap_size_mb = 512
