# Fly.io app configuration for Rabbit Backend.
# See https://fly.io/docs/reference/configuration/ for details.

app = 'rabbit-backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  # Keep one machine alive to avoid cold-start latency.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1

# Add swap for short memory spikes. If real traffic keeps hitting OOM,
# scale memory instead of relying on swap.
swap_size_mb = 512
